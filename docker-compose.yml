version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sunpower-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: solar_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sunpower-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5173,http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/solar_management?schema=public
      JWT_SECRET: solar_secret_jwt_key_hackathon_2026_super_secure
    ports:
      - "5000:5000"

volumes:
  pgdata:
