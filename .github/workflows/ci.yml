name: SunPower Solar ERP CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: solar_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Prisma Migrations & Seed
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/solar_management?schema=public
          JWT_SECRET: solar_secret_jwt_key_hackathon_2026_super_secure
          PORT: 5000
          CLIENT_URL: http://localhost:5173
        run: |
          npx prisma migrate deploy
          npm run seed

      - name: Run Automated Verification Suite (Rules 1-6)
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/solar_management?schema=public
          JWT_SECRET: solar_secret_jwt_key_hackathon_2026_super_secure
          PORT: 5000
          CLIENT_URL: http://localhost:5173
        run: node test_phase3_phase4.js

      - name: Run Automated Verification Suite (Rules 7-11)
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/solar_management?schema=public
          JWT_SECRET: solar_secret_jwt_key_hackathon_2026_super_secure
          PORT: 5000
          CLIENT_URL: http://localhost:5173
        run: node test_phase5_phase6.js

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./client
        run: npm run build
